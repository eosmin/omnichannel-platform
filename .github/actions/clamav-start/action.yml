name: Start ClamAV
description: >-
  Starts the virus scanner of the media suites in the background (the image pull included), so that its
  signature database loads while the job installs and builds, instead of holding the start of the job as a
  service container does (about 15 s). A pull or a start that fails is tried again (three times, with a
  pause), and the outcome is written for clamav-wait, which must run before the first step that scans a file.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        log="$RUNNER_TEMP/clamav-start.log"
        status="$RUNNER_TEMP/clamav-start.status"
        rm -f "$status"
        (
          # The registry or the daemon can fail for a moment: the image pull is the part that does. The image must stay the
          # one of docker-compose.yml (`pnpm validate:ci-shards` compares them: Dependabot reads only the compose file)
          for attempt in 1 2 3; do
            echo "clamav start, attempt $attempt"
            docker rm -f clamav || true
            if docker pull clamav/clamav:1.5.4-debian && docker run -d --name clamav -p 3310:3310 \
              --restart on-failure:3 \
              --health-cmd "clamdcheck.sh" \
              --health-start-period 180s --health-interval 10s --health-timeout 10s --health-retries 20 \
              clamav/clamav:1.5.4-debian; then
              echo started > "$status"
              exit 0
            fi
            # No pause after the last try: the outcome is written at once
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo failed > "$status"
        ) > "$log" 2>&1 &
