name: Wait for ClamAV
description: >-
  Waits until the container that clamav-start began answers its health check. It fails the job, with what the
  start and the container said, as soon as the start gave up (three tries), the container stops or turns unhealthy,
  or if it is not healthy in 6 minutes.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        status=missing
        for _ in $(seq 1 90); do
          status=$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' clamav 2>/dev/null || echo missing)
          case "$status" in
            "running healthy")
              echo "ClamAV is healthy"
              exit 0
              ;;
            "exited "* | "dead "* | *unhealthy)
              break
              ;;
          esac
          # The start tried three times and gave up: nothing will ever answer, so do not wait the six minutes
          if [ "$(cat "$RUNNER_TEMP/clamav-start.status" 2>/dev/null)" = "failed" ]; then
            status="the start gave up"
            break
          fi
          sleep 4
        done
        echo "::error::ClamAV did not become healthy (state: $status)"
        cat "$RUNNER_TEMP/clamav-start.log" || true
        docker ps -a || true
        docker logs --tail 40 clamav || true
        exit 1
