name: Web stack
description: >-
  Everything a job that drives the built web app in a browser needs, except its services (a composite
  action cannot declare them): Node and pnpm, the dependencies, a migrated database and Chromium.
  Used by e2e-tests and lighthouse. The job sets DIRECT_DATABASE_URL, DB_APP_PASSWORD and
  DB_WORKER_PASSWORD, and checks out the repository first, or this file is not found.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
    - name: Migrate an empty database and give the roles their passwords
      run: pnpm db:migrate
      shell: bash
    # The web build reads its public variables when it compiles
    - name: Public variables of the web build
      run: cp apps/web/.env.example apps/web/.env.local
      shell: bash
    # The browser is the one thing the version of Playwright decides, so it is the cache key
    - name: Playwright version
      id: playwright
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache the browsers
      id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium and its system libraries
      if: steps.browsers.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
    # The browser comes from the cache, the libraries it links to do not
    - name: Install the system libraries of Chromium
      if: steps.browsers.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps chromium
      shell: bash
