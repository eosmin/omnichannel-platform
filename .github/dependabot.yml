version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # The TDD pins every version, so routine bumps are done on purpose: one area per PR, after
      # reading the changelog and updating the table. Security alerts are unaffected by this
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      # Majors still open a PR, except these two:
      # TypeScript stays on 5.9 until typescript-eslint, ts-jest and Nx certify the next major
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The runtime is Node 24, so the types follow the Node major
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
