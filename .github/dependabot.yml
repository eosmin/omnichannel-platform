version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # The TDD pins every version (TDD_01 §2.4): an upgrade re-fetches its documentation and updates
    # the table first, so a grouped minor/patch PR is a prompt to do that, not a PR to merge as is
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 5.9 until typescript-eslint, ts-jest and Nx certify the next major
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The runtime is Node 24, so the types follow the Node major
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
