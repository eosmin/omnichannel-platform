name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the superseded pull-request run; main and tag runs must finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_ENV: test
  # The Git hooks are for laptops: CI runs the same checks itself, as jobs
  HUSKY: '0'

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # nx-set-shas reads the last successful run of this workflow to find the base commit on main
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      # Production dependencies of every workspace package (dependencies, not devDependencies). A new high advisory in a
      # production dependency fails every pull request until it is fixed: on purpose. An advisory with
      # no fix goes to auditConfig.ignoreGhsas in pnpm-workspace.yaml with the reason, and to Step 7.1
      - name: Audit production dependencies
        timeout-minutes: 3
        run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      # The commits of the pull request and its title (it becomes the squash commit on main)
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      # Dependabot titles ("chore(deps-dev): bump <long name> from x to y") can pass 72 characters
      - name: Pull request title follows Conventional Commits
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - run: pnpm validate:deprecations
      - run: pnpm validate:translations
      - run: pnpm validate:env
      - run: pnpm validate:isolation
      - run: pnpm validate:frontend
      # Rule 13: no new knowledge of a channel or Meta outside libs/channels/*; the baseline only shrinks
      - run: pnpm validate:channel-agnostic --require-main
      # The image hosts of the CSP are written from what the plugins declare; a plugin that changes them must regenerate the file
      - run: pnpm validate:image-hosts
      # The web build reads its public variables when it compiles (apps/web/lib/env-schema.ts). The
      # example file holds valid local values, which is all a build that nobody deploys needs
      - name: Public variables of the web build
        run: cp apps/web/.env.example apps/web/.env.local
      # build too: a project that type-checks can still fail to compile, and the widget has no Dockerfile
      - name: Lint, type-check and build (affected on pull requests, everything on main)
        run: |
          if [ "${{ github.event_name }}" = "MEASURE-everything" ]; then
            pnpm exec nx affected --targets=lint,type-check,build --parallel=3
          else
            pnpm exec nx run-many --targets=lint,type-check,build --all --parallel=3
          fi

  # The unit tests with their coverage. The thresholds live in the jest.config of each project that
  # has one (TDD_13 section 9, only for the paths that exist so far): `--coverage` is what makes jest
  # enforce them.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # nx-set-shas reads the last successful run of this workflow to find the base commit on main
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - name: Unit tests with coverage (affected on pull requests, everything on main)
        run: |
          if [ "${{ github.event_name }}" = "MEASURE-everything" ]; then
            pnpm exec nx affected --targets=test --parallel=3 --coverage
          else
            pnpm exec nx run-many --targets=test --all --parallel=3 --coverage
          fi

  # The suites that need a real database. The api connects as platform_app, never as the owner.
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: platform_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d platform_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The email suites send through it and read what arrived over its HTTP API
      mailpit:
        image: axllent/mailpit:v1.28
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8025/readyz"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Object storage: readiness asks the bucket, and the media suites upload to it. The image makes
      # the bucket from S3_BUCKET; the keys are the ones of .env.example
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        ports: ['8333:8333']
        env:
          AWS_ACCESS_KEY_ID: dev_access_key
          AWS_SECRET_ACCESS_KEY: dev_secret_key
          S3_BUCKET: platform-dev
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8333/healthz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DIRECT_DATABASE_URL: postgresql://platform:ci_password@localhost:5432/platform_ci
      DB_APP_PASSWORD: ci_app_password
      DB_WORKER_PASSWORD: ci_worker_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The virus scanner of the media suites of the worker (a real scan of the EICAR test string). It loads its
      # signature database in the background while the job installs, and the suites wait for it below
      - uses: ./.github/actions/clamav-start
      - run: pnpm install --frozen-lockfile --prefer-offline
      # The SeaweedFS container creates the bucket after its health check passes
      - name: Wait for the bucket
        run: pnpm exec tsx scripts/wait-for-bucket.ts
      - name: Migrate an empty database and give the roles their passwords
        run: pnpm db:migrate
      - name: Every migration has a rollback
        run: pnpm validate:rollbacks
      - uses: ./.github/actions/clamav-wait
      # The api suite holds the coverage gates of the auth (95%) and tenancy (100%) folders (apps/api/jest.integration.config.cts), core-redis and core-audit their own
      - name: Integration suites
        run: pnpm exec nx run-many --target=test-integration --projects=core-database,core-redis,core-audit,worker,api
      # Pure code: every channel plugin passes the same suite (TDD_10 §9)
      - name: Plugin contract suites
        run: pnpm test:contracts
      - name: The api and the worker start and answer
        run: |
          pnpm exec nx run-many --target=build --projects=api,worker
          # Each service connects with its own role, as it does where it is deployed
          api_url=postgresql://platform_app:$DB_APP_PASSWORD@localhost:5432/platform_ci
          worker_url=postgresql://platform_worker:$DB_WORKER_PASSWORD@localhost:5432/platform_ci
          # The rest of the env is the one of .env.example
          set -a; . ./.env.example; set +a
          export NODE_ENV=test
          # The api, the worker and the smoke script share the queues under this prefix
          export QUEUE_PREFIX=ci
          touch api.log worker.log
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          DATABASE_URL=$api_url PORT=8081 node dist/apps/api/main.js > api.log 2>&1 &
          DATABASE_URL=$worker_url APP_ROLE=worker PORT=8082 node dist/apps/worker/main.js > worker.log 2>&1 &
          pnpm exec tsx scripts/smoke-http.ts http://localhost:8081
          pnpm exec tsx scripts/smoke-http.ts http://localhost:8082
          # The templates render in the bundle too, not only under ts-jest
          pnpm exec tsx scripts/smoke-email.ts
      - name: Service logs
        if: failure()
        run: |
          tail -n 40 api.log worker.log
          docker logs --tail 40 clamav || true
      # Last, because it empties the database: the rollbacks must run cleanly, newest first
      - name: Rollbacks run
        run: |
          for file in $(ls libs/core/database/rollbacks/*.rollback.sql | sort -r); do
            psql "$DIRECT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

  # The tenant isolation suite (TDD_13 section 6) and the endpoint specs of tests/api: the real app of
  # the api, the real Postgres and Redis, the database role the api runs with. A failure in the
  # isolation suite means a user could reach the data of a store they do not belong to. It runs in four
  # jobs (`SECURITY_SHARD`; the denominator must match the `--shard` of tests/project.json), each
  # with its own services; it also needs SeaweedFS, for the media suites (Step 3.4). The required check
  # is `security-tests`, below.
  security-shards:
    name: security-shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # The quarters of the suite, one shard of jest each, in a job of its own with its own services
        # (`SECURITY_SHARD`, read by `tests/project.json`; empty runs all four, as `pnpm test:security` does on a laptop).
        # Jest cuts the sorted list of files into slices of the same size, so the weight of a slice is luck: with
        # two the heavy specs (team, realtime, conversations-performance, ~28 s each) ended up 184 s against 242 s;
        # with four the slowest job took 156 s (134, 131, 156 and 127 s), peak memory 3.5-3.9 GB of the 16 GB of the runner
        shard: ['1/4', '2/4', '3/4', '4/4']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: platform_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d platform_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Object storage: readiness asks the bucket, and the media suites upload to it. The image makes
      # the bucket from S3_BUCKET; the keys are the ones of .env.example
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        ports: ['8333:8333']
        env:
          AWS_ACCESS_KEY_ID: dev_access_key
          AWS_SECRET_ACCESS_KEY: dev_secret_key
          S3_BUCKET: platform-dev
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8333/healthz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DIRECT_DATABASE_URL: postgresql://platform:ci_password@localhost:5432/platform_ci
      DB_APP_PASSWORD: ci_app_password
      DB_WORKER_PASSWORD: ci_worker_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # The SeaweedFS container creates the bucket after its health check passes
      - name: Wait for the bucket
        run: pnpm exec tsx scripts/wait-for-bucket.ts
      - name: Migrate an empty database and give the roles their passwords
        run: pnpm db:migrate
      - name: Tenant isolation suite and endpoint specs
        env:
          SECURITY_SHARD: ${{ matrix.shard }}
        run: |
          # The peak of memory used on the whole runner (jest, services and tooling), in the summary: the suite
          # once ran out of heap and nothing measured it. A trap writes it even if the step is cancelled
          memory="$RUNNER_TEMP/memory.txt"
          (while sleep 3; do free -m | awk '/^Mem:/ {print $3}'; done > "$memory") &
          sampler=$!
          report() {
            kill "$sampler" 2>/dev/null || true
            peak=$(sort -n "$memory" | tail -1)
            line="security shard ${{ matrix.shard }}: peak memory used on the runner ${peak:-unknown} MB"
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          trap report EXIT
          pnpm test:security

  # The required check. It keeps the name of the job that used to run the whole suite, and it runs whatever
  # happened upstream (`always()`): a shard that failed, was cancelled or was skipped can never read as a pass,
  # and only `success` of the matrix (every shard) is a green.
  security-tests:
    needs: [security-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The shards decide
        env:
          SHARDS: ${{ needs.security-shards.result }}
        run: |
          echo "security-shards=$SHARDS"
          if [ "$SHARDS" = "success" ]; then exit 0; fi
          echo "::error::The shards of the security suite did not all succeed ($SHARDS)"
          exit 1

  # Builds the image of each service and scans it. A critical or high vulnerability that has a fix
  # fails the job; the ones nobody has fixed yet do not.
  security-scan:
    name: security-scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            port: 8080
            file: docker/node-service.Dockerfile
            build-args: APP=api
          - app: worker
            port: 8081
            file: docker/node-service.Dockerfile
            build-args: APP=worker
          # The NEXT_PUBLIC_* are baked into the bundle, so the build needs them
          - app: web
            port: 3000
            file: apps/web/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=https://api.example.com
              NEXT_PUBLIC_WS_URL=https://api.example.com
              NEXT_PUBLIC_STORAGE_URL=https://files.example.com
              NEXT_PUBLIC_WIDGET_SCRIPT_URL=https://cdn.example.com/widget.js
              NEXT_PUBLIC_VAPID_PUBLIC_KEY=BPJNI2b9XNUaMZdiMw-lw1t8o9c5IKKEydv4knzKkzklkUoVSQUsoRa2VLL7zfUv1NFEL891XQZ1zv8YSckI_k8
    # Only for the check that the image starts and answers
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: platform_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d platform_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Object storage: readiness asks the bucket, and the media suites upload to it. The image makes
      # the bucket from S3_BUCKET; the keys are the ones of .env.example
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        ports: ['8333:8333']
        env:
          AWS_ACCESS_KEY_ID: dev_access_key
          AWS_SECRET_ACCESS_KEY: dev_secret_key
          S3_BUCKET: platform-dev
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8333/healthz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the whole history. Every leg fetches it: in an expression, 0 is falsy, so
          # `cond && 0 || 1` would always give 1
          fetch-depth: 0
      # A secret that was ever committed stays in the history, so the whole history is scanned, once
      - name: Scan the history for secrets
        if: matrix.app == 'api'
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          # The release download answered 504 several times in a day and failed the whole scan. curl retries up to 5
          # times, 5 seconds apart, on any error (`--retry-all-errors`: a 5xx and a dropped connection alike); the
          # file is still checked against the pinned SHA256 below, so a retry never weakens what is run. Each attempt is
          # capped (15 s to connect, 60 s in all) and the retries stop after 150 s, so a host that hangs fails the leg in
          # minutes and not at the job timeout.
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 60 --retry-max-time 150 \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --verbose
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.app }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          tags: platform-${{ matrix.app }}:ci
          load: true
          push: false
          # One cache scope per image, so that the two builds do not evict each other
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      # The scan reads the operating system and the base image: the dependencies are inside the
      # bundle, where it cannot see them (Dependabot covers those). So also run the image, in the
      # mode it has where it is deployed, which no other job does.
      # The api writes the catalog of official plugins when it boots (D19), so it needs a migrated
      # database: it is not the empty one the worker is happy with
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.app == 'api'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.app == 'api'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Migrate the database the api image starts against
        if: matrix.app == 'api'
        env:
          DIRECT_DATABASE_URL: postgresql://platform:ci_password@localhost:5432/platform_ci
          DB_APP_PASSWORD: ci_app_password
          DB_WORKER_PASSWORD: ci_worker_password
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm db:migrate
      - name: The ${{ matrix.app }} image starts and answers
        if: matrix.app != 'web'
        run: |
          docker run -d --name service --network host --env-file .env.example \
            -e NODE_ENV=production -e APP_ROLE=${{ matrix.app }} -e PORT=${{ matrix.port }} \
            -e DATABASE_URL=postgresql://platform:ci_password@localhost:5432/platform_ci \
            -e JWT_SECRET="$(openssl rand -hex 24)" \
            -e CREDENTIALS_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e RESEND_API_KEY=re_ci_placeholder \
            -e META_APP_SECRET="$(openssl rand -hex 16)" \
            -e META_WEBHOOK_VERIFY_TOKEN="$(openssl rand -hex 16)" \
            -e BULL_BOARD_ENABLED=true \
            -e FRONTEND_URL=https://app.example.com \
            -e WIDGET_SCRIPT_URL=https://cdn.example.com/widget.js \
            -e TRUST_PROXY_HOPS=1 \
            platform-${{ matrix.app }}:ci
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused \
            http://localhost:${{ matrix.port }}/health/ready
          # Bull Board needs files of node_modules that the image copies by hand: with the flag on,
          # the api does not start without them, and it must answer 401 (not 404) without a token
          if [ "${{ matrix.app }}" = "api" ]; then
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:${{ matrix.port }}/admin/queues)
            test "$status" = "401" || { echo "Bull Board answered $status, expected 401"; exit 1; }
          fi
      # The web image needs no database: it must serve a page with the CSP its proxy builds
      - name: The web image starts and answers
        if: matrix.app == 'web'
        run: |
          docker run -d --name service --network host platform-web:ci
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused \
            --dump-header "$RUNNER_TEMP/headers.txt" --output /dev/null http://localhost:3000/login
          grep --ignore-case --quiet "^content-security-policy:.*script-src[^;]*'nonce-" "$RUNNER_TEMP/headers.txt"
          # The service worker of web push is built into the image at build time (the runtime image
          # has no esbuild) and must reach the whole origin, with no session and no login redirect
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/sw-headers.txt" \
            --output "$RUNNER_TEMP/sw.js" http://localhost:3000/serwist/sw.js
          grep --ignore-case --quiet '^service-worker-allowed: /' "$RUNNER_TEMP/sw-headers.txt"
          grep --quiet 'notificationclick' "$RUNNER_TEMP/sw.js"
      - name: Service log
        if: failure()
        run: docker logs service
      # The action caches the vulnerability database between runs
      - name: Scan the ${{ matrix.app }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # Whether the change can reach the web app: anything but the docs, the widget (its own bundle) and
  # the suites of tests/. A push to main always runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Ev '^(docs/|apps/widget/|tests/)|\.md$' || true)
          if [ -n "$relevant" ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  # The web app against the real api and worker, in a real browser: the bundles that `nx build`
  # writes, the fixtures of the development database, the magic links read from Mailpit. SeaweedFS
  # is one of the services since Step 3.4 (readiness asks the bucket). The suite runs in six slices
  # (`E2E_SHARD`), each in its own job with its own services, so the specs never share a database, a
  # mailbox or a queue across slices. The required check is `e2e-tests`, below, which waits for them.
  e2e-shards:
    name: e2e-shard (${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        # The number of slices, once: the name, E2E_SHARD and the summary read it from here. It must equal the length of the list above
        total: [6]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: platform_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d platform_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.28
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8025/readyz"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Object storage: readiness asks the bucket, and the media suites upload to it. The image makes
      # the bucket from S3_BUCKET; the keys are the ones of .env.example
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        ports: ['8333:8333']
        env:
          AWS_ACCESS_KEY_ID: dev_access_key
          AWS_SECRET_ACCESS_KEY: dev_secret_key
          S3_BUCKET: platform-dev
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8333/healthz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DIRECT_DATABASE_URL: postgresql://platform:ci_password@localhost:5432/platform_ci
      DB_APP_PASSWORD: ci_app_password
      DB_WORKER_PASSWORD: ci_worker_password
    steps:
      # The list of slices and `total` say the same number, or a slice would never run (and the check would stay green)
      - name: The slices are all there
        env:
          SLICES: ${{ strategy.job-total }}
          TOTAL: ${{ matrix.total }}
        run: |
          if [ "$SLICES" != "$TOTAL" ]; then
            echo "::error::The matrix has $SLICES slices but total says $TOTAL"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The virus scanner: a file an agent attaches in the composer is held until it is scanned clean, and
      # without a scanner every file ends unscannable. It loads its signature database in the background
      # while the stack is prepared, and the job waits for it to be healthy before the specs
      - uses: ./.github/actions/clamav-start
      - uses: ./.github/actions/web-stack
      - uses: ./.github/actions/clamav-wait
      # Builds the api, the worker and the web app, starts them, and runs the specs
      - name: End to end specs
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: pnpm exec nx run web-e2e:e2e --skip-nx-cache
      # Time per file and the cases that needed their retry, in the summary of the run, from the json of the reporter.
      # It is not uploaded: the json holds the errors and the output of the cases, and the repository is public
      - name: Time of the specs
        if: always()
        env:
          SLICE: ${{ matrix.shard }}/${{ matrix.total }}
        run: |
          file=apps/web-e2e/playwright-timing/results.json
          if [ ! -s "$file" ]; then echo "::warning::No timing report at $file"; exit 0; fi
          {
            echo "### Slice $SLICE: $(jq '(.stats.expected // 0) + (.stats.unexpected // 0) + (.stats.flaky // 0) + (.stats.skipped // 0)' "$file") cases, $(jq '((.stats.duration // 0) / 1000 | round)' "$file") s"
            echo '| File | Cases | Seconds |'
            echo '| --- | --- | --- |'
            jq -r '[.suites[] | {file, cases: [.. | objects | select(has("tests")) | .tests[]?] }]
              | map({file, n: (.cases | length), s: (([.cases[].results[]?.duration] | add // 0) / 1000 | round)})
              | sort_by(-.s)[] | "| \(.file) | \(.n) | \(.s) |"' "$file"
            echo
            echo '### Cases that passed only on a retry'
            jq -r '[.. | objects | select(has("tests")) | select(any(.tests[]; .status == "flaky")) | "- \(.file): \(.title)"] | if length == 0 then "none" else .[] end' "$file"
          } >> "$GITHUB_STEP_SUMMARY" || echo "::warning::The timing report could not be read"
      - name: Log of the virus scanner
        if: failure()
        run: docker logs --tail 40 clamav || true
      - name: Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web-e2e/playwright-report
            apps/web-e2e/test-results
          retention-days: 7

  # The required check. It keeps the name of the job that used to run the whole suite, and it is the only
  # place that says what the slices mean: it runs whatever happened upstream (`always()`), so a slice that
  # failed, was cancelled or was skipped because something before it failed can never read as a pass. The
  # slices are skipped on purpose only when `changes` finished and says the web app is untouched.
  e2e-tests:
    needs: [changes, e2e-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The slices decide
        env:
          CHANGES: ${{ needs.changes.result }}
          WEB: ${{ needs.changes.outputs.web }}
          SHARDS: ${{ needs.e2e-shards.result }}
        run: |
          echo "changes=$CHANGES web=$WEB e2e-shards=$SHARDS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The change detection did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$WEB" = "true" ]; then
            if [ "$SHARDS" = "success" ]; then exit 0; fi
            echo "::error::The slices of the suite did not all succeed ($SHARDS)"
            exit 1
          fi
          if [ "$WEB" = "false" ] && [ "$SHARDS" = "skipped" ]; then
            echo "The web app is untouched: the slices did not run"
            exit 0
          fi
          echo "::error::Unexpected state (web=$WEB, slices=$SHARDS)"
          exit 1

  # The performance budgets of TDD_08 §4.4 over the built app, in the browser of Playwright, signed in
  # with a magic link like e2e-tests. Pull requests only, and not a required check: the numbers of a
  # shared runner move, so the budgets are asserted on the median of three runs. The metrics of each
  # page are in the report.
  lighthouse:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: platform_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d platform_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.28
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8025/readyz"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Object storage: readiness asks the bucket, and the media suites upload to it. The image makes
      # the bucket from S3_BUCKET; the keys are the ones of .env.example
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        ports: ['8333:8333']
        env:
          AWS_ACCESS_KEY_ID: dev_access_key
          AWS_SECRET_ACCESS_KEY: dev_secret_key
          S3_BUCKET: platform-dev
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8333/healthz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DIRECT_DATABASE_URL: postgresql://platform:ci_password@localhost:5432/platform_ci
      DB_APP_PASSWORD: ci_app_password
      DB_WORKER_PASSWORD: ci_worker_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/web-stack
      - name: Lighthouse budgets
        run: pnpm exec nx run web-e2e:lighthouse --skip-nx-cache
      - name: Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: |
            apps/web-e2e/lighthouse-report
            apps/web-e2e/lighthouse-results
          retention-days: 7
