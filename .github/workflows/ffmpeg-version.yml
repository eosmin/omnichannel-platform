name: ffmpeg-version

# Trivy does not see the ffmpeg of the worker image (built by hand into /opt/ffmpeg, not an OS package or a lockfile entry). This is its watch:
# the pinned version must not fall behind the newest release published on ffmpeg.org. A failed run is the alarm (Step 7.3, dependency review).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pinned-is-current:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned ffmpeg is the newest release
        run: |
          pinned=$(sed -n 's/^ARG FFMPEG_VERSION=//p' docker/node-service.Dockerfile)
          test -n "$pinned"
          latest=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 https://ffmpeg.org/releases/ \
            | grep -o 'ffmpeg-[0-9][0-9.]*\.tar\.xz"' | sed 's/^ffmpeg-//; s/\.tar\.xz"$//' | sort -V | tail -n 1)
          test -n "$latest"
          echo "pinned=$pinned latest=$latest"
          if [ "$pinned" != "$latest" ]; then
            echo "::error::ffmpeg $pinned is pinned in docker/node-service.Dockerfile and $latest is published: read the release notes and security advisories, then change FFMPEG_VERSION and FFMPEG_SHA256 together"
            exit 1
          fi
      # A failed scheduled run only mails whoever touched the cron last: an open issue is seen by the owner and is not opened twice
      - name: Open an issue for the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='ffmpeg of the worker image is behind the latest release'
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "The weekly check found a newer ffmpeg than the one pinned in docker/node-service.Dockerfile (Trivy does not watch that binary). Read the release notes and the security advisories, then change FFMPEG_VERSION and FFMPEG_SHA256 together. Run: $RUN_URL"
          fi
