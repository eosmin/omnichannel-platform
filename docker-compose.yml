name: platform

services:
  postgres:
    image: postgres:18.6-alpine
    ports: ['5432:5432']
    # PgBouncer may open max_db_connections (100) backends, and migrations and the owner scripts connect
    # straight to Postgres beside it: the default of 100 would leave them no room (TDD_08 section 2.6)
    command: ['postgres', '-c', 'max_connections=200']
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: platform_dev
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-dev_pgbouncer_password}
    volumes:
      # Postgres 18 keeps its data in a versioned subdirectory, so the volume is mounted one level up
      - postgres_data:/var/lib/postgresql
      # Runs only when the volume is first created: after changing it, recreate the volume with `docker compose down -v`
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    ports: ['6432:6432']
    environment:
      # No database in the URL: the image then writes the wildcard entry `* = host=postgres`, so the
      # database the tests prepare (platform_test) goes through the pooler as well as platform_dev. The
      # URL only names the host and the auth_user, whose password is the one of PGBOUNCER_AUTH_PASSWORD
      DATABASE_URL: postgres://pgbouncer:${PGBOUNCER_AUTH_PASSWORD:-dev_pgbouncer_password}@postgres:5432
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer
      AUTH_QUERY: SELECT uname, phash FROM pgbouncer.user_lookup($1)
      # The function of the query lives in platform_dev only (scripts/postgres-init): every database asks it there
      AUTH_DBNAME: platform_dev
      # The settings of TDD_08 section 2.6, one by one
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 600
      MAX_DB_CONNECTIONS: 100
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      # SHOW POOLS and SHOW STATS (read-only) for the pgbouncer role, the one the monitoring uses
      STATS_USERS: pgbouncer
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage. MinIO stopped publishing images in October 2025, so SeaweedFS stands in;
  # it creates the bucket itself from S3_BUCKET.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    ports: ['8333:8333']
    environment:
      AWS_ACCESS_KEY_ID: dev_access_key
      AWS_SECRET_ACCESS_KEY: dev_secret_key
      S3_BUCKET: platform-dev
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.28
    ports: ['1025:1025', '8025:8025']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:1.5.4-debian
    ports: ['3310:3310']
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  clamav_data:
