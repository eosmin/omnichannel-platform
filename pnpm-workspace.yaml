allowBuilds:
  '@parcel/watcher': false
  nx: true
  unrs-resolver: true
  '@nestjs/core': false
  '@swc/core': false
  sharp: false
  esbuild: false
  '@prisma/engines': false
  prisma: false
  msgpackr-extract: false

# @nestjs/platform-express 12.2.0 (the latest) still ships multer 2.4.0, and the denial of service
# advisories of multer are fixed in 2.5.0. Remove this when Nest depends on multer 2.5 or later.
overrides:
  multer: 2.5.0

  # @nestjs/platform-socket.io 12.0.1 asks for socket.io 4.8.3. A 4.8.4 beside it installs a second copy
  # and the types of the two servers clash. Remove this when Nest depends on a later 4.8.
  socket.io: 4.8.3

  # @prisma/config 7.10.1 pins effect 3.20.0, which has GHSA-7589-6fvf-x4pw (ReDoS in Schema.TemplateLiteral,
  # fixed in 3.22.1) and fails `pnpm audit --prod --audit-level=high`. effect is only used by the prisma CLI
  # config loader (prisma generate/validate/migrate), never by our code. Remove this when prisma resolves
  # effect 3.22.1 or later by itself.
  '@prisma/config>effect': 3.22.1

# GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, ReDoS through single-branch repeated extglobs, high) has no patched version.
# The paths are @parcel/watcher, which sass (under next) and next-intl use to watch files: a build and dev tool that
# never matches a pattern a user sent, so it is not on the path of a request. Ignored here so that the audit gate
# (`pnpm audit --prod --audit-level=high`) does not fail every pull request; listed in Step 7.1 of the plan.
# Review by 2026-12-15, and remove this when a patched picomatch exists or @parcel/watcher / sass update it.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
